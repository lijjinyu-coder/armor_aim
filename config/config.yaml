%YAML:1.0
---
# ================================================================
#  装甲板自瞄系统 参数配置文件
#
#  填写约定:
#   1. 【必须填写】: 不填程序启动后会直接退出, 必须填写;
#   2. 【待填写】  : 建议按你的视频实际情况填写,
#                    值为 0(或空)时程序会使用内置的示例默认值,
#                    示例默认值不保证检测效果;
#   3. 【按需修改】: 已提供可用的示例值, 可按需求调整;
#   4. 数值型参数为 0 统一表示 "未配置", 真实参数不要写成 0。
# ================================================================

# ------------------- 一、视频输入 -------------------
# 测试视频路径(相对/绝对路径均可, 建议放入 videos/ 目录后填相对路径)
# 【必须填写】
video_path: "videos/2607071529162881.mp4"

# 是否把处理结果保存成视频 (true/false) 【按需修改】
save_video: true
# 结果视频保存路径 (留空时默认 output/output.avi) 【待填写】
save_video_path: ""
# 是否显示调试窗口 (false 时只静默处理并保存结果) 【按需修改】
show_debug: true

# ------------------- 二、图像预处理 -------------------
# 敌方颜色: BLUE / RED 【待填写】
enemy_color: "BLUE"
# 预处理方式: HSV / BGR / GRAY 【按需修改】
preprocess_mode: "HSV"

# HSV 阈值 (preprocess_mode = HSV 时生效) 【待填写】
# 全部为 0 时使用内置示例阈值;
# 红色阈值建议 h_low > h_high(如 170 > 10), 表示 170~180 与 0~10 两段环绕。
h_low: 0
s_low: 0
v_low: 0
h_high: 0
s_high: 0
v_high: 0

# GRAY 模式阈值 (preprocess_mode = GRAY 时生效) 【待填写】
gray_thresh: 120
# BGR 通道差分阈值 (preprocess_mode = BGR 时生效) 【待填写】
bgr_diff_thresh: 40

# ------------------- 三、灯条筛选 -------------------
# 灯条轮廓最小面积(px^2) 【待填写】(0 -> 默认 50)
lightbar_min_area: 0
# 灯条长边/短边最小比例 【待填写】(0 -> 默认 1.8)
lightbar_min_ratio: 1.3
# 灯条相对竖直方向最大夹角(度) 【待填写】(0 -> 默认 45)
lightbar_max_angle: 0

# ------------------- 四、装甲板匹配 -------------------
# 装甲板宽高比下限 【待填写】(0 -> 默认 1.8)
armor_min_ratio: 1.3
# 装甲板宽高比上限 【待填写】(0 -> 默认 5.0)
armor_max_ratio: 5.0
# 左右灯条角度和阈值(度, 内八判定) 【待填写】(0 -> 默认 30)
armor_angle_sum_max: 35
# 两灯条长度差比例阈值 【待填写】(0 -> 默认 0.35)
armor_length_diff_ratio: 1.0
# 两灯条纵向错位比例阈值 【待填写】(0 -> 默认 0.6)
armor_y_offset_ratio: 1.0

# ------------------- 五、目标选择与跟踪 -------------------
# 连续丢失帧数阈值, 超过后进入未发现目标状态 【待填写】(0 -> 默认 20)
lost_threshold: 0

# ------------------- 六、装甲板实际尺寸(mm) -------------------
# 装甲板宽度 【待填写】(0 -> 默认 130mm)
armor_width_mm: 0
# 装甲板高度 【待填写】(0 -> 默认 55mm)
armor_height_mm: 0
